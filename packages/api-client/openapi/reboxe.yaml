openapi: 3.1.0
info:
  title: REBOXE API
  version: 1.4.0
servers:
  - url: http://127.0.0.1:3001
paths:
  /v1/admin/disputes/{caseId}/ai-reports/evidences:
    parameters:
      - name: caseId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAiEvidence
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Evidence identities available to an authorized reviewer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, stored, mimeType]
                  properties:
                    id: { type: string }
                    stored: { type: boolean }
                    mimeType: { type: [string, 'null'] }
  /v1/admin/disputes/{caseId}/ai-reports/{evidenceId}/stored:
    parameters:
      - { name: caseId, in: path, required: true, schema: { type: string } }
      - { name: evidenceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: analyzeStoredEvidence
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Advisory reports; original evidence never returned to the browser
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, evidenceId, report, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    evidenceId: { type: string }
                    report: { $ref: '#/components/schemas/AiReport' }
                    createdAt: { type: string, format: date-time }
  /v1/shops/{shopId}/marketplaces:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    get:
      operationId: listMarketplaceConnections
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - connections
                - availability
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketplaceConnection'
                  availability:
                    type: array
                    items:
                      type: object
                      required:
                      - platform
                      - configured
                      properties:
                        platform:
                          $ref: '#/components/schemas/Marketplace'
                        configured:
                          type: boolean
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/marketplaces/authorize:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    post:
      operationId: beginMarketplaceAuthorization
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectMarketplace'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - authorizationUrl
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/marketplaces/complete:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    post:
      operationId: completeMarketplaceAuthorization
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMarketplaceAuthorization'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - sessionId
                - shops
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  shops:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/marketplaces/confirm:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    post:
      operationId: confirmMarketplaceShop
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMarketplaceShop'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketplaceConnection'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/marketplaces/{platform}:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    - name: platform
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Marketplace'
    delete:
      operationId: disconnectMarketplace
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - disconnected
                properties:
                  disconnected:
                    type: boolean
                    const: true
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/checkout/quote:
    post:
      operationId: quoteCheckout
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInit'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutQuote'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/disputes/{caseId}/ai-reports:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listAiReports
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - evidenceId
                  - report
                  - createdAt
                  properties:
                    id:
                      type: string
                      format: uuid
                    evidenceId:
                      type: string
                    report:
                      $ref: '#/components/schemas/AiReport'
                    createdAt:
                      type: string
                      format: date-time
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/disputes/{caseId}/ai-reports/{evidenceId}:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
    - name: evidenceId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: analyzeEvidence
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - evidenceId
                  - report
                  - createdAt
                  properties:
                    id:
                      type: string
                      format: uuid
                    evidenceId:
                      type: string
                    report:
                      $ref: '#/components/schemas/AiReport'
                    createdAt:
                      type: string
                      format: date-time
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/disputes/{caseId}/evidence-uploads:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: prepareEvidenceUpload
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceUpload'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - uploadUrl
                - headers
                - expiresAt
                properties:
                  id:
                    type: string
                    format: uuid
                  uploadUrl:
                    type: string
                    format: uri
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                  expiresAt:
                    type: string
                    format: date-time
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/disputes/{caseId}/evidence-uploads/{uploadId}/complete:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
    - name: uploadId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: completeEvidenceUpload
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    const: READY
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/payment-options:
    get:
      operationId: paymentOptions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - payosPromotionPayments
                - sandboxPromotions
                properties:
                  payosPromotionPayments:
                    type: boolean
                  sandboxPromotions:
                    type: boolean
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/promotion-topups:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    post:
      operationId: createPromotionTopup
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionTopupInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionTopup'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/promotion-topups/{id}:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getPromotionTopup
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionTopup'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/webhooks/payos/promotions:
    post:
      operationId: payosPromotionWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                  matched:
                    type: boolean
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shipping/ghn/provinces:
    get:
      operationId: ghnprovinces
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shipping/ghn/districts:
    parameters:
    - in: query
      name: provinceId
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: ghndistricts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shipping/ghn/wards:
    parameters:
    - in: query
      name: districtId
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: ghnwards
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/shops/{shopId}/shipping/quote:
    parameters:
    - $ref: '#/components/parameters/ShopId'
    post:
      operationId: quoteShipping
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarrierQuoteInput'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - carrier
                - feeVnd
                - estimated
                - environment
                - quotedAt
                properties:
                  carrier:
                    type: string
                    const: GHN
                  feeVnd:
                    type: integer
                    minimum: 0
                  estimated:
                    type: boolean
                    const: true
                  environment:
                    type: string
                    enum:
                    - STAGING
                    - PRODUCTION
                  quotedAt:
                    type: string
                    format: date-time
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/me:
    get:
      operationId: getActorContext
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current actor and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorContext"
  /v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Active categories available to the seller picker
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /v1/seller-onboarding/uploads:
    post:
      operationId: createSellerDocumentUploadIntent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSellerDocumentUpload"
      responses:
        "201":
          description: Signed upload intent for an avatar or private KYC document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImageUploadIntent"
  /v1/kyc/start:
    post:
      operationId: startKyc
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shopId]
              properties:
                shopId: { type: string }
      responses:
        "201":
          description: Idempotently starts KYC for an owned shop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStartResult" }
  /v1/kyc/document/front:
    post:
      operationId: submitKycDocumentFront
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized front-side OCR and document validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/document/back:
    post:
      operationId: submitKycDocumentBack
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized back-side OCR and document validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/selfie:
    post:
      operationId: submitKycSelfie
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/KycImage" }
      responses:
        "201":
          description: Normalized face-match and liveness result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/tax:
    post:
      operationId: submitKycTax
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kycId, taxCode]
              properties:
                kycId: { type: string }
                taxCode: { type: string, pattern: '^\d{10}(-\d{3})?$' }
      responses:
        "201":
          description: Tax verification recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/bank:
    post:
      operationId: submitKycBank
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kycId, bankCode, accountNumber]
              properties:
                kycId: { type: string }
                bankCode: { type: string, minLength: 2, maxLength: 30 }
                accountNumber: { type: string, pattern: '^\d{6,30}$' }
      responses:
        "201":
          description: Bank account verified and authoritative holder name compared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/kyc/{kycId}/status:
    get:
      operationId: getKycStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kycId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current normalized KYC status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
  /v1/admin/kyc:
    get:
      operationId: listKycReviews
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: status
        in: query
        schema: {type: string, enum: [MANUAL_REVIEW], default: MANUAL_REVIEW}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 200}
        description: Opaque nextCursor from the previous page.
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKycQueue'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/admin/kyc/{kycId}:
    get:
      operationId: getKycReview
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: kycId
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminKycDetail'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/admin/kyc/{kycId}/decision:
    post:
      operationId: decideKycReview
      description: Requires database staff role MODERATOR or SUPER_ADMIN, ACTIVE profile/role, and verified JWT aal2.
      security:
      - {bearerAuth: []}
      parameters:
      - name: kycId
        in: path
        required: true
        schema: {type: string}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authorized KYC review response
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KycDecisionResult'}
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Active moderator/super admin and AAL2 required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: KYC not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: Invalid query, body or key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Already decided or idempotency key reused with a different payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KycDecision'}
