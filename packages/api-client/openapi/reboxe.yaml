        shopStatus: { type: string, enum: [ONBOARDING, ACTIVE, PAUSED, LOCKED_INSUFFICIENT_FUND, SUSPENDED] }
    ActorContext:
      type: object
      additionalProperties: false
      required: [id, profileStatus, shops]
      properties:
        id: {type: string, format: uuid}
        profileStatus:
          anyOf:
          - {type: string, enum: [ACTIVE, SUSPENDED, DELETED]}
          - {type: 'null'}
        shops:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName, role, membershipStatus, kycId, kycStatus, status]
            properties:
              id: {type: string}
              displayName: {type: string}
              role: {type: string, enum: [OWNER, MANAGER, WAREHOUSE, ACCOUNTING]}
              membershipStatus: {type: string}
              kycId: {type: [string, 'null']}
              kycStatus: {type: string, enum: [PENDING, PROCESSING, VERIFIED, REJECTED, MANUAL_REVIEW]}
              status: {type: string, enum: [ONBOARDING, ACTIVE, PAUSED, LOCKED_INSUFFICIENT_FUND, SUSPENDED]}
