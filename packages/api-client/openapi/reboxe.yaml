components:
  requestBodies:
    KycImage:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [kycId, objectKey]
            properties:
              kycId: { type: string }
              objectKey: { type: string, minLength: 1, maxLength: 500 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ShopId:
      name: shopId
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Marketplace:
      type: string
      enum:
      - SHOPEE
      - TIKTOK
    MarketplaceConnection:
      type: object
      additionalProperties: false
      required:
      - id
      - platform
      - externalShopId
      - shopName
      - status
      - connectedAt
      - expiresAt
      - lastSyncedAt
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/Marketplace'
        externalShopId:
          type: string
        shopName:
          type: string
        status:
          type: string
          enum:
          - CONNECTED
          - REAUTH_REQUIRED
          - DISCONNECTED
        connectedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSyncedAt:
          type:
          - string
          - 'null'
          format: date-time
    ConnectMarketplace:
      type: object
      properties:
        platform:
          type: string
          enum:
          - SHOPEE
          - TIKTOK
        noticeVersion:
          type: string
          const: '2026-10-20'
        consent:
          type: boolean
          const: true
      required:
      - platform
      - noticeVersion
      - consent
      additionalProperties: false
    CompleteMarketplaceAuthorization:
      type: object
      properties:
        state:
          type: string
          pattern: ^[a-f0-9]{64}$
        code:
          type: string
          minLength: 1
          maxLength: 2048
        externalShopId:
          type: string
          maxLength: 100
      required:
      - state
      - code
      additionalProperties: false
    ConfirmMarketplaceShop:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        externalShopId:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - sessionId
      - externalShopId
      additionalProperties: false
    AiReport:
      type: object
      properties:
        schemaVersion:
          type: string
          const: triage-v1
        modelId:
          type: string
          minLength: 1
          maxLength: 200
        modelRevision:
          type: string
          pattern: ^[a-f0-9]{40}$
        promptVersion:
          type: string
          const: unboxing-v1
        evidenceChecksum:
          type: string
          pattern: ^[a-f0-9]{64}$
        durationSeconds:
          type: number
          minimum: 0
          maximum: 90
        sampledTimestamps:
          minItems: 1
          maxItems: 16
          type: array
          items:
            type: number
            minimum: 0
            maximum: 90
        visualAssessment:
          type: object
          properties:
            assessment:
              type: string
              enum:
              - VISIBLE_DAMAGE
              - NO_CLEAR_DAMAGE
              - INSUFFICIENT_EVIDENCE
            observations:
              maxItems: 16
              type: array
              items:
                type: object
                properties:
                  timestamp_seconds:
                    type: number
                    minimum: 0
                    maximum: 90
                  description:
                    type: string
                    minLength: 1
                    maxLength: 500
                required:
                - timestamp_seconds
                - description
                additionalProperties: false
            limitations:
              maxItems: 10
              type: array
              items:
                type: string
                maxLength: 500
          required:
          - assessment
          - observations
          - limitations
          additionalProperties: false
        recommendation:
          type: string
          const: ADMIN_REVIEW
        financialAction:
          type: string
          const: NONE
        calibrated:
          type: boolean
          const: false
      required:
      - schemaVersion
      - modelId
      - modelRevision
      - promptVersion
      - evidenceChecksum
      - durationSeconds
      - sampledTimestamps
      - visualAssessment
      - recommendation
      - financialAction
      - calibrated
      additionalProperties: false
    CheckoutQuote:
      type: object
      required:
      - subtotalVnd
      - shippingVnd
      - totalVnd
      - mode
      properties:
        subtotalVnd:
          type: integer
          minimum: 1
        shippingVnd:
          type: integer
          minimum: 0
        totalVnd:
          type: integer
          minimum: 1
        mode:
          type: string
          const: SANDBOX
    EvidenceUpload:
      type: object
      properties:
        processingRecordId:
          type: string
          minLength: 1
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - video/mp4
          - video/webm
          - video/quicktime
        sizeBytes:
          type: integer
          exclusiveMinimum: 0
          maximum: 20971520
        checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - processingRecordId
      - mimeType
      - sizeBytes
      - checksum
      additionalProperties: false
    PromotionTopupInput:
      type: object
      properties:
        amountVnd:
          type: integer
          minimum: 10000
          maximum: 10000000
        idempotencyKey:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
      - amountVnd
      - idempotencyKey
      additionalProperties: false
    CarrierQuoteInput:
      type: object
      properties:
        listingId:
          type: string
          minLength: 1
          maxLength: 200
        districtId:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        wardCode:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,20}$
      required:
      - listingId
      - districtId
      - wardCode
      additionalProperties: false
    PromotionTopup:
      type: object
      required:
      - id
      - amountVnd
      - status
      - checkoutUrl
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        amountVnd:
          type: integer
        status:
          type: string
          enum:
          - CREATING
          - UNKNOWN
          - PENDING
          - PAID
          - CANCELLED
          - EXPIRED
          - BLOCKED
        checkoutUrl:
          type:
          - string
          - 'null'
        expiresAt:
          type: string
          format: date-time

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    Category:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
