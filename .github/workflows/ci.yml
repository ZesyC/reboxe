name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54321-54329
          for attempt in 1 2 3; do
            if corepack pnpm supabase start; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            corepack pnpm supabase stop --no-backup || true
            sleep 5
          done
          eval "$(corepack pnpm supabase status -o env)"
          {
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Apply canonical migration and synthetic seed
        run: corepack pnpm db:migrate && corepack pnpm db:seed
      - name: Verify generated API contract
        run: corepack pnpm --filter @reboxe/api-client generate && git diff --exit-code -- packages/api-client/src/generated.ts
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Test
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm build
      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Browser smoke test
        run: corepack pnpm test:e2e
